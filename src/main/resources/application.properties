spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================== Flyway 資料庫版本控管 ====================================
# 啟動時自動掃 db/migration，把還沒跑過的 migration 依版本號執行
# 這個專案從第一天就用 Flyway 管理，資料庫是全新的空庫，
# baseline 保持 false 比較安全：萬一哪天歷史紀錄掉了，Flyway 會明確報錯，
# 而不是安靜地跳過 V1 害你以為表建好了。
# =======================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false


# ============================== JPA / Hibernate ==============================
# 資料表結構一律由 Flyway 負責，絕對不要讓 Hibernate 自己去改結構，
# 所以 ddl-auto 設成 none。
spring.jpa.hibernate.ddl-auto=none

# 關閉 Open Session In View ，讓查詢邊界留在 Service 層，效能問題比較容易看出來。
spring.jpa.open-in-view=false

# 開發時把實際執行的 SQL 印出來，方便對照。正式環境請關掉。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================== HikariCP 連線池設定 ==============================
spring.datasource.hikari.pool-name=MyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================== 其他設定 ==============================

# 當 Controller 回傳 Page 時，序列化前自動幫我包成 PagedModel
spring.data.web.pageable.serialization-mode=via_dto
# ============================== JWT ==============================
# secret：簽 token 用的金鑰。HS256 演算法要求至少 256 bit（32 bytes），
#   這裡放 64 個 hex 字元（= 64 bytes）給開發環境用。
#   ${JWT_SECRET:預設值} 的意思是：有環境變數 JWT_SECRET 就用它，沒有才用冒號後面的預設值。
#   正式環境務必用環境變數覆蓋，不要把真實金鑰 commit 進版控。
# expiration-ms：token 有效時間（毫秒）。28800000 = 8 小時，約一個班的長度。
jwt.secret=${JWT_SECRET:d43994983f7bdb33b15b2a3083b53cdf2d3b5a2ba744da4c2c44f1706eadb5dc}
jwt.expiration-ms=28800000
